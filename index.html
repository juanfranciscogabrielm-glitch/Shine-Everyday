<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Marketplace Avanzado</title>

<style>

body{
margin:0;
font-family:Arial;
background:#ebebeb;
}

/* HEADER */

header{
background:#ffe600;
display:flex;
align-items:center;
padding:10px 20px;
gap:20px;
}

.logo{
font-size:24px;
font-weight:bold;
}

.search{
flex:1;
padding:10px;
border:none;
border-radius:6px;
}

.icons{
display:flex;
gap:15px;
}

.icon{
background:white;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* CATEGORIAS */

.categories{
display:flex;
gap:15px;
padding:10px 20px;
background:white;
border-bottom:1px solid #ddd;
}

.cat{
cursor:pointer;
}

/* PRODUCTOS */

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:10px;
padding:10px;
position:relative;
transition:0.2s;
}

.card:hover{
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.price{
font-size:20px;
color:#00a650;
}

.star{
color:gold;
}

.fav{
position:absolute;
right:10px;
top:10px;
cursor:pointer;
font-size:18px;
}

button{
background:#3483fa;
color:white;
border:none;
padding:8px;
border-radius:5px;
cursor:pointer;
margin-top:5px;
}

/* CARRITO */

#cart{
position:fixed;
right:-380px;
top:0;
width:380px;
height:100%;
background:white;
box-shadow:-4px 0 15px rgba(0,0,0,0.2);
padding:20px;
transition:0.3s;
overflow:auto;
}

.cart-item{
border-bottom:1px solid #ddd;
padding:10px 0;
}

.remove{
color:red;
cursor:pointer;
}

.qty{
display:flex;
gap:5px;
margin-top:5px;
}

.qty button{
background:#ddd;
color:black;
}

</style>
</head>

<body>

<header>

<div class="logo">Mi Mercado</div>

<input class="search" id="search" placeholder="Buscar productos">

<div class="icons">

<div class="icon" onclick="toggleCart()">
🛒 <span id="cartCount">0</span>
</div>

<div class="icon">
❤️ <span id="favCount">0</span>
</div>

</div>

</header>

<div class="categories">

<div class="cat" onclick="filterCat('all')">Todo</div>
<div class="cat" onclick="filterCat('carteras')">Carteras</div>
<div class="cat" onclick="filterCat('mochilas')">Mochilas</div>
<div class="cat" onclick="filterCat('accesorios')">Accesorios</div>

</div>

<div class="products" id="products"></div>

<div id="cart">

<h2>Carrito</h2>

<div id="cartItems"></div>

<h3>Total: $<span id="total">0</span></h3>

<button onclick="buy()">Comprar</button>

</div>

<script>

let products=[
{nombre:"Cartera Negra",precio:15000,categoria:"carteras",img:"https://via.placeholder.com/300"},
{nombre:"Cartera Rosa",precio:17000,categoria:"carteras",img:"https://via.placeholder.com/300"},
{nombre:"Mochila Urbana",precio:22000,categoria:"mochilas",img:"https://via.placeholder.com/300"},
{nombre:"Cartera Blanca",precio:18000,categoria:"carteras",img:"https://via.placeholder.com/300"},
{nombre:"Bolso Moda",precio:21000,categoria:"accesorios",img:"https://via.placeholder.com/300"}
]

let cart=JSON.parse(localStorage.getItem("cart"))||[]
let fav=JSON.parse(localStorage.getItem("fav"))||[]

function renderProducts(lista){

let container=document.getElementById("products")

container.innerHTML=""

lista.forEach((p,i)=>{

container.innerHTML+=`

<div class="card">

<div class="fav" onclick="addFav(${i})">❤️</div>

<img src="${p.img}">

<h3>${p.nombre}</h3>

<div class="star">★★★★★</div>

<p class="price">$${p.precio}</p>

<button onclick="addCart(${i})">Agregar al carrito</button>

</div>

`

})

}

renderProducts(products)

function addCart(i){

let prod=products[i]

let found=cart.find(p=>p.nombre==prod.nombre)

if(found){

found.qty++

}else{

cart.push({...prod,qty:1})

}

saveCart()

updateCart()

}

function updateCart(){

let items=document.getElementById("cartItems")

items.innerHTML=""

let total=0

cart.forEach((p,i)=>{

total+=p.precio*p.qty

items.innerHTML+=`

<div class="cart-item">

${p.nombre} - $${p.precio}

<div class="qty">

<button onclick="changeQty(${i},-1)">-</button>

${p.qty}

<button onclick="changeQty(${i},1)">+</button>

<span class="remove" onclick="remove(${i})">❌</span>

</div>

</div>

`

})

document.getElementById("total").innerText=total
document.getElementById("cartCount").innerText=cart.length

}

function changeQty(i,n){

cart[i].qty+=n

if(cart[i].qty<=0){

cart.splice(i,1)

}

saveCart()

updateCart()

}

function remove(i){

cart.splice(i,1)

saveCart()

updateCart()

}

function toggleCart(){

let c=document.getElementById("cart")

c.style.right=c.style.right=="0px"?"-380px":"0px"

}

function addFav(i){

fav.push(products[i])

localStorage.setItem("fav",JSON.stringify(fav))

document.getElementById("favCount").innerText=fav.length

}

function filterCat(cat){

if(cat=="all"){

renderProducts(products)

}else{

renderProducts(products.filter(p=>p.categoria==cat))

}

}

document.getElementById("search").addEventListener("input",e=>{

let text=e.target.value.toLowerCase()

renderProducts(products.filter(p=>p.nombre.toLowerCase().includes(text)))

})

function saveCart(){

localStorage.setItem("cart",JSON.stringify(cart))

}

function buy(){

alert("Compra realizada")

cart=[]

saveCart()

updateCart()

}

updateCart()

document.getElementById("favCount").innerText=fav.length

</script>

</body>
</html>
